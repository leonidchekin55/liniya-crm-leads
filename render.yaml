services:
  - type: web
    name: liniya-crm-leads
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: pnpm install --prod --frozen-lockfile
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DATABASE_URL
        fromDatabase:
          name: liniya-crm-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true

databases:
  - name: liniya-crm-db
    databaseName: liniya_crm
    user: liniya_crm
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "18"
    ipAllowList: []
